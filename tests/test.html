<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klang tests</title>
  <style>
    body { font: 14px/1.5 -apple-system, system-ui, sans-serif; margin: 20px; background: #fff; color: #111; }
    .pass { color: #137333; } .fail { color: #b3261e; font-weight: 600; }
    pre { background: #f4f4f4; padding: 8px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Klang unit tests</h1>
  <p id="summary">Running…</p>
  <ol id="out"></ol>
  <script type="module">
    // Everything below runs against sandboxed copies of Klang's localStorage keys (restored at the end).
    const KEYS = ['klang.v1', 'klang.activity.posts.v1', 'klang.listening.v1', 'klang.feed.v1'];
    const savedKeys = Object.fromEntries(KEYS.map((k) => [k, localStorage.getItem(k)]));

    const { generateDemo, DEMO_ANCHOR, DEMO_END } = await import('../js/data/generate.js');
    const { CITIES, EXTRA_CITIES } = await import('../js/data/cities.js');
    const { VENUES } = await import('../js/data/venues.js');
    const { WORKS, COMPOSERS } = await import('../js/data/repertoire.js');
    const { COUNTRIES, country, countryCities, otherCountries } = await import('../js/data/countries.js');
    const { parseICS, buildICS, parseFeed, matchCity, matchVenue, matchComposer, matchProgramItem, matchProgram, workFromTitle, workIdentity, composerKey, isBoilerplate, arrangerOf, isWorkLine, englishNumbered } = await import('../js/ics.js');
    const listen = await import('../js/ui/listen.js');
    const { zurichOffset, dayKeyOf, timeOf, addDays, relDayLabel, fullDateTime } = await import('../js/time.js');
    const store = await import('../js/store.js');
    const i18n = await import('../js/i18n.js');
    const feed = await import('../js/feed.js');
    const repo = await import('../js/repo.js');
    const ent = await import('../js/views/entity.js');
    store.setPref('lang', 'en'); // the tests below expect English unless they switch to Chinese

    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    function test(name, fn) {
      try { fn(); out.insertAdjacentHTML('beforeend', `<li class="pass">✓ ${name}</li>`); pass++; }
      catch (e) { out.insertAdjacentHTML('beforeend', `<li class="fail">✗ ${name}<pre>${e.message}</pre></li>`); fail++; }
    }
    const eq = (a, b, msg = '') => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg} expected ${JSON.stringify(b)} got ${JSON.stringify(a)}`); };
    const ok = (v, msg) => { if (!v) throw new Error(msg || 'assertion failed'); };

    const demo = generateDemo();

    test('47 Swiss cities, 839 snapshot concerts', () => {
      eq(CITIES.length, 47);
      eq(CITIES.reduce((s, c) => s + c.snapshot, 0), 839);
    });
    test('every city has at least one venue', () => {
      for (const c of CITIES) ok(VENUES.some((v) => v.cityId === c.id), `no venue for ${c.id}`);
    });
    test('every work references a known composer and has a search phrase', () => {
      for (const w of WORKS) { ok(COMPOSERS.some((c) => c.id === w.composerId), w.id); ok(w.q && w.minutes > 0, w.id); }
    });
    test('upcoming demo counts per city equal the screenshot counts (window from anchor)', () => {
      for (const city of CITIES) {
        const n = demo.concerts.filter((c) => c.cityId === city.id && dayKeyOf(c.start) >= DEMO_ANCHOR && dayKeyOf(c.start) <= DEMO_END).length;
        eq(n, city.snapshot, city.name);
      }
    });
    test('demo concert ids are unique and stable across runs', () => {
      const ids = demo.concerts.map((c) => c.id);
      eq(new Set(ids).size, ids.length, 'unique');
      eq(generateDemo().concerts[0].id, ids[0]);
    });
    test('every demo concert has venue in its city, programme and credits', () => {
      for (const c of demo.concerts) {
        const v = VENUES.find((x) => x.id === c.venueId);
        ok(v && v.cityId === c.cityId, `${c.id} venue/city mismatch`);
        ok(c.program.length > 0, `${c.id} empty programme`);
        ok(c.credits.length > 0, `${c.id} no credits`);
        ok(c.program.every((p) => WORKS.some((w) => w.id === p.workId)), `${c.id} unknown work`);
      }
    });
    test('no venue hosts two demo concerts at overlapping times', () => {
      const byVenueDay = new Map();
      for (const c of demo.concerts) {
        const k = `${c.venueId}|${dayKeyOf(c.start)}`;
        const list = byVenueDay.get(k) || [];
        for (const o of list) {
          const [x, y] = Date.parse(o.start) <= Date.parse(c.start) ? [o, c] : [c, o];
          ok(Date.parse(y.start) >= Date.parse(x.start) + x.durationMin * 60000, `${x.id} overlaps ${y.id}`);
        }
        list.push(c);
        byVenueDay.set(k, list);
      }
    });
    test('all demo performers are marked demo (invented)', () => {
      ok(demo.artists.length > 20);
      ok(demo.artists.every((a) => a.demo));
    });
    test('Zurich time helpers (DST)', () => {
      eq(zurichOffset('2026-07-01'), '+02:00');
      eq(zurichOffset('2026-12-01'), '+01:00');
      eq(zurichOffset('2026-10-24'), '+02:00');
      eq(zurichOffset('2026-10-25'), '+01:00');
      eq(dayKeyOf('2026-11-01T19:30:00+01:00'), '2026-11-01');
      eq(timeOf('2026-11-01T19:30:00+01:00'), '19:30');
      eq(addDays('2026-12-31', 1), '2027-01-01');
      eq(relDayLabel('2026-10-27', '2026-10-26'), 'Tomorrow');
    });
    test('city matching handles German/French names', () => {
      eq(matchCity('Tonhalle, Zürich'), 'zurich');
      eq(matchCity('Victoria Hall, Genève'), 'geneva');
      eq(matchCity('KKL Luzern'), 'lucerne');
      eq(matchCity('Stadtcasino Basel'), 'basel');
      eq(matchCity('Salle de musique, La Chaux-de-Fonds'), 'la-chaux-de-fonds');
      eq(matchCity('Nowhere special'), null);
      eq(matchCity('Genf'), 'geneva');
      eq(matchCity('Bâle'), 'basel');
      eq(matchCity('Lucerna'), 'lucerne');
      eq(matchCity('St.Gallen'), 'st-gallen');
      eq(matchCity('Biel/Bienne'), 'biel');
      eq(matchCity('Mézières (FR)'), 'mezieres-fr', 'Mézières FR is not Mézières VD');
      eq(matchCity('Mézières'), 'mezieres');
    });
    test('venue matching stays within the listing\'s city', () => {
      eq(matchVenue('Stadtkirche', 'liestal')?.id, 'stadtkirche-liestal');
      eq(matchVenue('Cathédrale', 'lausanne')?.id, 'cathedrale-lausanne');
      eq(matchVenue('Stadtcasino Basel, Hans Huber-Saal', 'basel')?.id, 'stadtcasino-basel');
      eq(matchVenue('Theater St.Gallen, Grosses Haus', 'st-gallen')?.id, 'theater-st-gallen');
      eq(matchVenue('Martinskirche Chur', 'chur'), null, 'not Basel\'s Martinskirche');
      eq(matchVenue('Opernhaus im Quartier', 'zurich'), null, 'an outreach series, not the opera house');
    });
    test('composers: German / French / Italian spellings, and their namesakes', () => {
      eq(matchComposer('Pjotr Iljitsch Tschaikowsky'), 'tchaikovsky');
      eq(matchComposer('Piotr Il\'ič Čajkovskij'), 'tchaikovsky');
      eq(matchComposer('Dmitri Chostakovitch'), 'shostakovich');
      eq(matchComposer('Dmitrij Schostakowitsch'), 'shostakovich');
      eq(matchComposer('Sergej Rachmaninow'), 'rachmaninoff');
      eq(matchComposer('Igor Strawinsky'), 'stravinsky');
      eq(matchComposer('Antonín Dvořák'), 'dvorak');
      eq(matchComposer('Felix Mendelssohn Bartholdy'), 'mendelssohn');
      eq(matchComposer('Georg Friedrich Haendel'), 'handel');
      eq(matchComposer('Béla Bartók'), 'bartok');
      eq(matchComposer('L. v. Beethoven'), 'beethoven');
      eq(matchComposer('Wolfgang Amadeus Mozart / Franz Xaver Süssmayr'), 'mozart');
      eq(matchComposer('Richard Strauss'), 'richard-strauss');
      eq(matchComposer('Johann Strauss (Sohn)'), 'johann-strauss');
      eq(matchComposer('Strauss', 'Also sprach Zarathustra'), 'richard-strauss', 'Strauss by work');
      eq(matchComposer('Strauss', 'Kaiserwalzer op. 437'), 'johann-strauss', 'Strauss by work');
      for (const other of ['Carl Philipp Emanuel Bach', 'Alma Mahler', 'Clara Schumann', 'Fanny Hensel-Mendelssohn', 'Josef Strauss', 'Mozart Camargo Guarnieri', 'Modest Mussorgsky']) {
        eq(matchComposer(other), null, other);
      }
    });
    test('works: real German / French / Italian programme lines', () => {
      const w = (composer, title) => matchProgramItem({ composer, title }).workId || null;
      eq(w('Ludwig van Beethoven', 'Sinfonie Nr. 5 c-Moll op. 67'), 'beethoven-symphony-5');
      eq(w('Ludwig van Beethoven', 'Symphonie n°5 en do mineur, op. 67'), 'beethoven-symphony-5');
      eq(w('Pjotr Iljitsch Tschaikowsky', 'Sinfonie Nr. 6 Pathétique in h-Moll, op. 74'), 'tchaikovsky-pathetique');
      eq(w('Antonín Dvořák', 'Concerto pour violoncelle en si mineur, op. 104'), 'dvorak-cello-concerto');
      eq(w('Antonín Dvořák', '9. Sinfonie e-Moll op. 95 «Aus der Neuen Welt»'), 'dvorak-new-world');
      eq(w('Franz Schubert', 'Symphonie n°7 en si mineur, D. 759, « Inachevée »'), 'schubert-unfinished', 'catalogue wins over numbering');
      eq(w('Igor Strawinsky', 'Der Feuervogel, Ballett-Suite (1909/1919)'), 'stravinsky-firebird');
      eq(w('Sergej Rachmaninow', 'Symphonische Tänze op. 45 (1940)'), 'rachmaninoff-symphonic-dances');
      eq(w('L. van Beethoven', 'Trio pour piano n°7 en si bémol majeur, op.97, « Archiduc »'), 'beethoven-archduke');
      eq(w('Piotr Il\'ič Čajkovskij', 'Concerto per pianoforte e orchestra n. 1 in si bemolle minore op. 23'), 'tchaikovsky-piano-concerto-1');
      eq(w('Wolfgang Amadeus Mozart', 'Die Zauberflöte'), 'mozart-magic-flute');
      // not the work we know
      eq(w('Ludwig van Beethoven', 'Trio für Flöte, Fagott und Klavier, WoO 37'), null, 'WoO is not Op. 97');
      eq(w('Felix Mendelssohn', 'Konzert für Violine und Streichorchester d-Moll, MWV O3'), null, 'the D minor concerto');
      eq(w('Wolfgang Amadeus Mozart', 'Sinfonie Nr. 40 in g-Moll, KV 550'), null, 'K. 550 is not K. 551');
      eq(w('Maurice Ravel', 'Introduction et Allegro für Harfe, Streichquartett, Flöte und Klarinette'), null, 'quartet only in the scoring');
      eq(w('Johann Sebastian Bach', 'Chaconne aus der Partita für Violine Nr. 2 d-Moll BWV 1004'), null, 'a movement');
      eq(w('Antonio Vivaldi', 'La primavera (Der Frühling) RV 269'), null, 'one season');
      const ex = matchProgramItem({ composer: 'Wolfgang Amadeus Mozart', title: 'Ouvertüre zur Oper «Die Zauberflöte» KV 620' });
      eq([ex.composerId, ex.workId, ex.title], ['mozart', undefined, 'Ouvertüre zur Oper «Die Zauberflöte» KV 620'], 'overture: composer only, raw title kept');
    });
    test('a listing titled with an opera or song cycle gets that work', () => {
      eq(workFromTitle('Die Zauberflöte')?.id, 'mozart-magic-flute');
      eq(workFromTitle('Zauberflöte')?.id, 'mozart-magic-flute');
      eq(workFromTitle('La traviata')?.id, 'verdi-traviata');
      eq(workFromTitle('«Die Winterreise»')?.id, 'schubert-winterreise');
      eq(workFromTitle('Marathon Bohême'), null, 'not just a word of the title');
      eq(workFromTitle('Carmen-Suite'), null);
      eq(workFromTitle('Orgelkonzert'), null);
    });
    test('works: requiems, Passions, Masses and the Four Seasons as programmes list them', () => {
      const w = (composer, title) => matchProgramItem({ composer, title }).workId || null;
      eq(w('Wolfgang Amadeus Mozart', 'Requiem in d-Moll KV 626 (1791) (~50′)'), 'mozart-requiem');
      eq(w('Wolfgang Amadeus Mozart', 'Requiem en ré mineur, K. 626'), 'mozart-requiem');
      eq(w('Jean-Sébastien Bach', 'Messe en si mineur, BWV 232'), 'bach-mass-b-minor');
      eq(w('Johann Sebastian Bach', 'h-Moll Messe, BWV 232'), 'bach-mass-b-minor');
      eq(w('Johannes Brahms', 'Ein deutsches Requiem, op. 45'), 'brahms-requiem');
      eq(w('Johann Sebastian Bach', 'Passion selon saint Matthieu, BWV 244'), 'bach-st-matthew');
      eq(w('Johann Sebastian Bach', 'Weihnachtsoratorium BWV 248 (Kantaten 1, 3 und 6)'), 'bach-christmas-oratorio');
      eq(w('Antonio Vivaldi', 'Vier Jahreszeiten'), 'vivaldi-four-seasons');
      eq(w('Antonio Vivaldi', '«Le Quattro Stagione» («Die vier Jahreszeiten») Violinkonzerte op. 8/1-4'), 'vivaldi-four-seasons');
      eq(w('Antonio Vivaldi', 'Le Quattro Stagioni, op. 8 – La Primavera (RV 269) – L’Estate (RV 315) – L’Autunno (RV 293) – L’Inverno (RV 297)'), 'vivaldi-four-seasons');
      eq(w('Antonio Vivaldi', 'L’Hiver (Les Quatre Saisons)'), null, 'one season');
      eq(w('Franz Schubert', 'Symphonie inachevée en si mineur'), 'schubert-unfinished');
      eq(w('Georges Bizet', 'Carmen (version de concert)'), 'bizet-carmen', 'a concert version is still the opera');
      eq(w('Camille Saint-Saëns', 'Le Carnaval des animaux pour deux pianos et orchestre'), 'saint-saens-carnival', 'two pianos are its scoring');
    });
    test('works: a transcription or arrangement is not the original', () => {
      const w = (composer, title) => matchProgramItem({ composer, title }).workId || null;
      eq(w('Franz Schubert', 'Sinfonie Nr. 7 Die Unvollendete in h-Moll, D 759, transkribiert für zwei Klaviere von Mikhail Pletnev'), null, 'Pletnev two-piano Unfinished');
      eq(w('Franz Schubert', 'Sinfonie h-Moll D 759 «Unvollendete», Klavierfassung'), null);
      eq(w('Franz Schubert', 'Symphonie inachevée, arr. pour quintette'), null);
      eq(w('Franz Schubert', 'Sinfonie Nr. 8 h-Moll D 759 für zwei Klaviere'), null, 'a reduction of a symphony');
      eq(w('Johann Sebastian Bach', 'Variations Goldberg, BWV 988 Transcription pour orgue par Jean-Luc Thellin'), null);
      eq(w('Franz Schubert', 'Symphonie n°7 en si mineur, D. 759, « Inachevée »'), 'schubert-unfinished', 'the original, numbered 7');
      eq(arrangerOf('Sinfonie Nr. 7 Die Unvollendete in h-Moll, D 759, transkribiert für zwei Klaviere von Mikhail Pletnev'), 'Pletnev');
      eq(arrangerOf('«Venezianisches Gondellied» (arr. Virgile Barthe)'), 'Barthe');
      eq(arrangerOf('3e Symphonie, (transcription pour quatuor avec piano de Ferdinand Ries)'), 'Ries');
      eq(arrangerOf('Streichquartett Nr. 16 F-Dur, op. 135 (Fassung für Streichorchester)'), null, 'no name given');
      eq(arrangerOf('Ouverture de La Forza del Destino'), null, 'not an arrangement');
    });
    test('a line naming only the composer takes the work the listing\'s title names', () => {
      const ids = (lines, title) => matchProgram(lines, title).map((p) => p.workId || null);
      eq(ids([{ composer: 'Händel', title: '' }], 'Händel, Messiah'), ['handel-messiah']);
      eq(ids([{ composer: 'Strawinsky', title: '' }, { composer: 'Mozart', title: '' }], 'Paavo Järvi mit Mozarts Requiem'), [null, 'mozart-requiem']);
      eq(ids([{ composer: 'Bach', title: '' }, { composer: 'Mozart', title: '' }], 'Les Musiciens du Louvre – Mozarts Requiem'), [null, 'mozart-requiem']);
      eq(ids([{ composer: 'Bach', title: '' }], 'Sir John Eliot Gardiner: Bach, Messe h-Moll'), ['bach-mass-b-minor']);
      eq(ids([{ composer: 'Brahms', title: '' }], 'Brahms: Ein deutsches Requiem'), ['brahms-requiem']);
      eq(ids([{ composer: 'Bach', title: '' }], 'Bach: Matthäuspassion'), ['bach-st-matthew']);
      eq(ids([{ composer: 'Vivaldi', title: '' }], 'Philharmonie der Solisten / VIVALDI - Die vier Jahreszeiten'), ['vivaldi-four-seasons']);
      eq(ids([{ composer: 'Mozart', title: '' }], 'Ein Requiem für Zürich – Werke von Pärt und Mozart'), [null], 'a generic name needs the composer next to it');
      eq(ids([{ composer: 'Mozart', title: 'Sinfonie Nr. 40 g-Moll KV 550' }], 'Mozart Requiem'), [null], 'a line with its own title keeps it');
      ok(isBoilerplate('Programmänderungen vorbehalten.') && isBoilerplate('Konzert mit Pause') && isBoilerplate('Ca. 2 Stunden 15 Minuten'), 'boilerplate');
      ok(!isBoilerplate('Pavane pour une infante défunte'), 'a work is not boilerplate');
    });
    test('work identity: the same work in German, French and Italian listings is one work', () => {
      const key = (composer, title) => workIdentity(matchProgramItem({ composer, title }))?.key || null;
      const same = (a, b, msg) => { const x = key(...a); const y = key(...b); ok(x && x === y, `${msg}: ${x} vs ${y}`); return x; };
      eq(same(['Ludwig van Beethoven', 'Sinfonie Nr. 4 B-Dur, op. 60'], ['Ludwig van Beethoven', 'Symphonie N° 4 en si bémol majeur op. 60'], 'Beethoven 4'), 'x-beethoven-op60');
      eq(same(['Sergej Prokofjew', 'Sinfonie Nr. 1 D-Dur op. 25 (Symphonie Classique)'], ['Sergueï Prokofiev', 'Symphonie n°1 en ré majeur, op. 25, « Classique »'], 'Prokofjew / Prokofiev'), 'x-prokofiev-op25');
      same(['Wolfgang Amadeus Mozart', 'Symphonie n°29 en la majeur, KV 201'], ['W. A. Mozart', 'Sinfonie Nr. 29 A-Dur, KV201'], 'KV 201');
      same(['Franz Schubert', 'Sinfonia n. 9 in do maggiore D 944 La Grande'], ['Franz Schubert', 'Sinfonie Nr. 8 C-Dur, D 944 «Grosse»'], 'D 944 numbered 8 or 9');
      same(['Joseph Haydn', 'Sinfonie Nr. 100 G-Dur, Hob I:100 «Militär»'], ['Joseph Haydn', 'Symphonie n° 100 en sol majeur, Hob. I:100'], 'Hob. I:100');
      same(['L. van Beethoven', 'Quatuor à cordes nº7 en fa majeur, op.59 nº1, «Razumovsky»'], ['Ludwig van Beethoven', 'Streichquartett Nr. 7 Rasumowsky in F-Dur, op. 59/1'], 'op. 59 No. 1');
      same(['Felix Mendelssohn Bartholdy', 'Konzert für Violine, Klavier und Streichorchester d-Moll'], ['Felix Mendelssohn', 'Concerto pour violon, piano et cordes en ré mineur'], 'no catalogue: form, scoring and key');
      same(['Joseph Haydn', 'Cellokonzert Nr. 1 in C-Dur'], ['Franz Joseph Haydn', 'Concerto per violoncello e orchestra n. 1 in do maggiore'], 'Italian');
      same(['Ludwig van Beethoven', 'Coriolan-Ouvertüre op. 62'], ['Ludwig van Beethoven', 'Ouvertüre zum Trauerspiel «Coriolan» c-Moll, op. 62'], 'an overture');
      same(['Pjotr Iljitsch Tschaikowsky', 'Excerpts from the ballet Sleeping Beauty, Op. 66'], ['Pjotr Iljitsch Tschaikowsky', 'Dornröschen, Ballett op. 66'], 'excerpts of the whole ballet');
      same(['Dieter Ammann', '«Turn» für Orchester'], ['Ammann', 'Turn'], 'surname only');
      eq(composerKey('Carl Philipp Emanuel Bach'), 'cpe-bach', 'a namesake keeps the initials');
      eq(composerKey('C. P. E. Bach'), 'cpe-bach');
      eq(composerKey('Leopold Mozart'), 'l-mozart');
      eq(composerKey('Rimski-Korsakow'), composerKey('Nikolai Rimsky-Korsakov'), 'transliterations');
    });
    test('work identity: different works stay apart', () => {
      const key = (composer, title) => workIdentity(matchProgramItem({ composer, title }))?.key || null;
      const apart = (a, b, msg) => { const x = key(...a); const y = key(...b); ok(x && y && x !== y, `${msg}: both ${x}`); };
      apart(['Ludwig van Beethoven', 'Sinfonie Nr. 4 B-Dur, op. 60'], ['Ludwig van Beethoven', 'Sinfonie Nr. 7 A-Dur, op. 92'], 'op. 60 / op. 92');
      apart(['Franz Schubert', 'Sinfonie Nr. 8 C-Dur'], ['Franz Schubert', 'Sinfonie Nr. 8 h-Moll'], 'same number, other key');
      apart(['Sergej Prokofjew', 'Klavierkonzert Nr. 2 g-Moll'], ['Sergej Prokofjew', 'Violinkonzert Nr. 2 g-Moll'], 'piano / violin');
      apart(['Pjotr Iljitsch Tschaikowski', 'Schwanensee op. 20'], ['Pjotr Iljitsch Tschaikowski', 'Schwanensee op. 20, 2. Akt, Nr. 13 Tanz der kleinen Schwäne'], 'one number of the ballet');
      apart(['Pjotr Iljitsch Tschaikowski', 'Schwanensee op. 20'], ['Pjotr Iljitsch Tschaikowski', 'Schwanensee op. 20, Introduktion'], 'its introduction');
      apart(['Peter Tschaikowski', 'Der Nussknacker, op. 71 (1892)'], ['Pjotr Iljitsch Tschaikowsky', 'Nussknacker-Suite, op. 71a'], 'ballet / suite');
      apart(['Wolfgang Amadeus Mozart', 'Ouvertüre zu Don Giovanni KV 527'], ['Wolfgang Amadeus Mozart', 'Duett «La ci darem la mano» aus der Oper Don Giovanni, KV 527'], 'overture / duet');
      apart(['Ludwig van Beethoven', 'Streichquartett Nr. 16 F-Dur, op. 135'], ['Ludwig van Beethoven', 'Streichquartett Nr. 16 F-Dur, op. 135 (Fassung für Streichorchester)'], 'original / arrangement');
      apart(['Johann Sebastian Bach', 'Partita Nr. 2 c-Moll BWV 826'], ['Johann Sebastian Bach', 'Partita en ré mineur, BWV 1004'], 'two partitas');
      apart(['Johannes Brahms', 'Vier Klavierstücke op. 119'], ['Johannes Brahms', 'Klavierstücke, op. 119, Intermezzi nos 1, 3 et 4'], 'a choice of pieces');
      apart(['Johann Sebastian Bach', 'Sinfonia d-Moll'], ['Johann Christoph Friedrich Bach', 'Sinfonia in d-Moll für Streicher und Basso continuo'], 'namesakes');
      eq(workIdentity(matchProgramItem({ composer: 'Johann Sebastian Bach', title: 'Triosonate Es-Dur BWV 525, Triosonate d-Moll BWV 527' })).by, 'title', 'several works in one line: no catalogue key');
      eq(workIdentity({ composer: 'Werke von', title: 'P. Tschaikowski, G. Puccini, M. Glinka, J. Strauss u.a.' }), null, 'not a work');
      eq(workIdentity({ composer: 'Orawa', title: 'für Streichorchester' }), null, 'a continuation line');
      eq(workIdentity({ composer: 'Mozart', title: '' }), null, 'no title');
    });
    test('work lines: "Für Elise" is a work, "für Streichorchester" is not; several works in one line; concert overtures', () => {
      const key = (composer, title) => workIdentity(matchProgramItem({ composer, title }))?.key || null;
      ok(isWorkLine(matchProgramItem({ composer: 'Ludwig van Beethoven', title: 'Für Elise' })), 'Für Elise');
      ok(isWorkLine({ composer: 'Wolfgang Amadeus Mozart', title: '« Per questa bella mano », air pour basse, contrebasse obligée et orchestre, KV 612' }), 'an aria');
      ok(isWorkLine({ composer: 'Claude Debussy', title: 'Pour le piano' }), 'Pour le piano');
      ok(!isWorkLine({ composer: 'Orawa', title: 'für Streichorchester' }) && !isWorkLine({ composer: 'X', title: 'pour piano et orchestre' }), 'a scoring continued from the line before');
      ok(/^x-beethoven-/.test(key('Ludwig van Beethoven', 'Für Elise')), 'Für Elise gets a work page');
      eq(workIdentity(matchProgramItem({ composer: 'Antonín Dvořák', title: 'Danses slaves pour quatre mains, extraits des op. 46 et 72' })).by, 'title', 'op. 46 et 72: two works');

      eq(lyu.map((it) => [it.rawTitle, it.workKey]), [['Mazurkas op. 41: Nr. 1 cis-Moll, Nr. 2 e-Moll, Nr. 3 B-Dur, Nr. 4 As-Dur', 'x-chopin-op41'], ['Prélude Des-Dur op. 28 Nr. 15 (“Regentropfen-Prélude”)', 'x-chopin-op28-15']], 'a heading joined with its numbers; one prélude');
      ok(!ent.workPageData('chopin-preludes', '2026-10-26').rows.some((r) => r.id === 'feed-stadtcasino_basel-23052027_tianyao_lyu'), 'not on the 24 Préludes page');
    });
    test('Listen cards only for lines that name a work', () => {
      const tempi = repo.programItems(repo.concert('feed-stadtcasino_basel-210227_i_tempi'));
      eq(tempi.map((it) => [it.rawTitle, !!it.workKey, repo.namesWork(it)]), [['Vier Jahreszeiten', true, true], ['Weitere virtuose Werke', false, false]]);
      const ocf = repo.programItems(repo.concert('feed-ocf_fribourg-8490'));
      eq(ocf.map((it) => [it.rawTitle, repo.namesWork(it)]), [['Symphonie n° 100 en sol majeur (dite « Militaire »)', true], ['Création', false], ['Symphonie n° 3 pour soprano et orchestre', true]]);
      eq(repo.namesWork({ title: 'Création', workKey: null }), false);
    });
    test('work index: a listing by form, scoring and key joins the numbered work; so does another language\'s spelling', () => {
      const ids = (id) => repo.concert(id).program.map(repo.workIdOf);
      eq(ids('feed-tonhalle-2056720'), ['x-mendelssohn-mwv-o4'], 'Konzert für Violine, Klavier und Streichorchester d-Moll = MWV O 4');
      eq(ids('feed-casino_bern-dovgan-eigus-20261126-1930'), ['x-mendelssohn-mwv-o4']);
      eq(ids('feed-ocg-eternel-beethoven-20261219')[0], 'x-beethoven-op86', 'Messe en ut majeur = Messe in C-Dur, op. 86');
      eq(ids('feed-osi-175715631901023'), ['x-beethoven-op62-overture'], 'Coriolano ouverture = Ouvertüre zur Oper Coriolan, op. 62');
      eq(ent.workPageData('x-beethoven-op62-overture', '2026-10-26').rows.map((r) => r.where), ['KKL Luzern · Lucerne', 'LAC Lugano Arte e Cultura · Lugano']);
      const test = ids('feed-test-same-key');
      ok(test[0] !== test[1], `Mozart's "Messe C-Dur" is not K. 317: ${test}`);
      ok(test[2] !== test[3], `a one-soloist concerto by key alone: ${test}`);
    });
    test('no demo concerts at run time', () => {
      ok(repo.allConcerts().length >= FIXTURE.concerts.length, 'fixture loaded');
      ok(repo.allConcerts().every((c) => !c.demo && !c.id.startsWith('demo-') && (c.id.startsWith('feed-') || c.imported)), 'only real listings and imports');
      ok(repo.allArtists().every((a) => !a.demo), 'no invented performers');
      eq(store.pref('showDemo'), undefined, 'old demo switch gone');
    });
    test('feed keeps past concerts for 120 days (Look back) and drops vanished upcoming ones', () => {
      const prev = { sources: [], concerts: [
        { id: 'a', title: 'Past, kept', start: '2026-09-01T19:30:00+02:00' },
        { id: 'b', title: 'Too old', start: '2026-05-01T19:30:00+02:00' },
        { id: 'c', title: 'Upcoming, no longer listed', start: '2026-11-01T19:30:00+01:00' },
      ] };
      const next = feed.mergeFeed({ generatedAt: 'x', sources: [], concerts: [{ id: 'd', title: 'New', start: '2026-11-02T19:30:00+01:00' }, { title: 'broken' }] }, prev, '2026-10-26');
      eq(next.concerts.map((c) => c.id), ['a', 'd']);
      eq(repo.pastStart('2026-10-26'), '2026-06-28');
      ok(feed.feedInfo().sources.length === FIXTURE.sources.length && feed.feedInfo().generatedAt === FIXTURE.generatedAt, 'feedInfo');
      eq(repo.concert('feed-test-unknown-town').sourceName, null, 'unknown source: no attribution invented');
    });

    // ---------- Sheng's countries ----------
    test('countries: Sheng\'s 47, in its order, with regions and cities', () => {
      eq(COUNTRIES.length, 47);
      eq(new Set(COUNTRIES.map((c) => c.id)).size, 47);
      eq(COUNTRIES[0].name, 'Germany');
      ok(country('Switzerland').swiss && otherCountries().length === 46, 'Switzerland');
      ok(countryCities('Germany').includes('Berlin') && countryCities('germany').includes('Munich'), 'Germany');
      ok(country('Japan').regions.some((r) => r.name === 'Tokyo' && r.cities.includes('Hachioji')), 'Japan regions');
      ok(country('United States').partial?.length > 0, 'partial lists noted');
      ok(otherCountries().every((c) => countryCities(c).length > 0), 'every other country has cities');
    });

    // ---------- interface language ----------
    test('i18n: English by default, Simplified Chinese on request', () => {
      try {
        store.setPref('lang', 'en');
        eq([i18n.t('Concerts'), i18n.tn(1, '{n} concert', '{n} concerts'), i18n.tn(3, '{n} concert', '{n} concerts')], ['Concerts', '1 concert', '3 concerts']);
        eq([i18n.dayMonth('2026-10-27'), i18n.relDay('2026-10-27', '2026-10-26'), relDayLabel('2026-10-30', '2026-10-26')], ['Oct 27', 'Tomorrow', 'Fri, Oct 30']);
        eq([i18n.monthYear('2026-10'), fullDateTime('2026-10-27T19:30:00+01:00'), i18n.joinList(['A', 'B', 'C'])], ['October 2026', 'Tue, Oct 27, 2026 · 19:30', 'A, B and C']);
        store.setPref('lang', 'zh');
        eq(i18n.lang(), 'zh');
        eq([i18n.t('Concerts'), i18n.tn(3, '{n} concert', '{n} concerts'), i18n.t('Featured only')], ['音乐会', '3 场音乐会', '仅看精选']);
        eq([i18n.dayMonth('2026-10-27'), i18n.relDay('2026-10-27', '2026-10-26'), relDayLabel('2026-10-27', '2026-10-26')], ['10月27日', '明天', '明天']);
        eq([relDayLabel('2026-10-30', '2026-10-26'), relDayLabel('2027-01-05', '2026-10-26')], ['10月30日 周五', '2027年1月5日 周二']);
        eq([fullDateTime('2026-10-27T19:30:00+01:00'), i18n.monthYear('2026-10'), i18n.joinList(['马勒', '布鲁克纳', '贝多芬']), i18n.joinList(['A', 'B', 'C'])], ['2026年10月27日 周二 · 19:30', '2026年10月', '马勒、布鲁克纳和贝多芬', 'A、B 和 C']);
        // t() closes the spaces between Chinese characters, but keeps the one between a date and its weekday
        eq([i18n.t('Updated {date}', { date: '10月30日 周五' }), i18n.tidyZh('在 Apple Music 古典乐 中打开')], ['更新于 10月30日 周五', '在 Apple Music 古典乐中打开']);
        eq(i18n.t('Opened in {app}', { app: i18n.t('Apple Music Classical') }), '已在 Apple Music 古典乐中打开', 'no space between Chinese characters');
        eq(i18n.t('Opened in {app}', { app: 'Apple Music' }), '已在 Apple Music 中打开');
        eq(i18n.cityName(repo.city('zurich')), '苏黎世');
        eq(i18n.t('An English sentence nobody translated'), 'An English sentence nobody translated', 'falls back to English');
      } finally {
        store.setPref('lang', 'en');
      }
      eq(i18n.t('Concerts'), 'Concerts', 'restored');
    });

    // ---------- local assistant ----------
    const eng = await import('../js/assistant-engine.js');
    const ask = (q) => eng.answer(q, { today: '2026-10-26' });
    test('assistant: concert search with composer + city + month', () => {
      const a = ask('Any Mahler in Zurich in November');
      ok(a.items.length > 0 && a.items.every((i) => i.kind === 'concert'), 'expected concerts');
      ok(/Mahler/.test(a.reply) && /Zurich/.test(a.reply), a.reply);
    });
    test('assistant: work by description and by catalogue number', () => {
      ok(ask('the Bach with 30 variations').items.some((i) => i.kind === 'work' && i.id === 'bach-goldberg'));
      ok(ask('BWV 988').items.some((i) => i.id === 'bach-goldberg'));
    });
    test('assistant: recording intent returns a recording item', () => {
      ok(ask("Abbado's Mahler 2").items.some((i) => i.kind === 'recording'));
    });
    test('assistant: Swiss composers and venues', () => {
      const ids = ask('that Swiss composer').items.map((i) => i.id);
      ok(['honegger', 'martin', 'bloch'].every((id) => ids.includes(id)), ids.join());
      ok(ask('Tonhalle').items.some((i) => i.kind === 'venue'));
    });
    test('assistant: places abroad with listings, and those without', () => {
      const a = ask('concerts in Wien in November');
      ok(a.items.some((i) => i.id === 'feed-test_abroad-vienna'), a.reply);
      ok(ask('Mahler in Austria').items.some((i) => i.id === 'feed-test_abroad-vienna'), 'the whole country');
      ok(!/left out/.test(ask('concerts in Vienna').reply), 'Vienna is covered');
      store.setPref('lang', 'zh');
      try {
        const z = eng.answer('维也纳的音乐会', { today: '2026-10-26' });
        ok(z.items.some((i) => i.id === 'feed-test_abroad-vienna') && !/忽略/.test(z.reply), z.reply);
        ok(/忽略了“马德里”/.test(eng.answer('马德里的音乐会', { today: '2026-10-26' }).reply), 'Madrid has no listings');
      } finally { store.setPref('lang', 'en'); }
    });
    test('assistant: French/German city names', () => {
      ok(/Geneva/.test(ask('chamber music in Genève this weekend').reply) || ask('chamber music in Genève this weekend').items.length >= 0);
      ok(ask('opera in Bâle next week').reply.length > 0);
    });

    // ---------- personal store (runs against the sandboxed localStorage) ----------
    const am = await import('../js/applemusic.js');
    try {
      store.resetAll();
      store.setPref('lang', 'en');
      test('favourites toggle and are logged in the personal timeline', () => {
        eq(store.toggleFollow('composer', 'bach'), true);
        ok(store.isFollowing('composer', 'bach'));
        eq(store.timeline()[0].type, 'favorite');
        eq(store.toggleFollow('composer', 'bach'), false);
      });
      test('library albums and concert playlists', () => {
        eq(store.toggleAlbum({ id: 123, title: 'Goldberg', artist: 'Gould' }), true);
        ok(store.hasAlbum(123) && store.libraryAlbums().length === 1);
        eq(store.togglePlaylist({ id: 'concert-x', name: 'X', items: [] }), true);
        ok(store.hasPlaylist('concert-x'));
        store.toggleAlbum({ id: 123 }); store.togglePlaylist({ id: 'concert-x' });
        eq(store.libraryAlbums().length + store.libraryPlaylists().length, 0);
      });
      test('hidden concerts are excluded from queries', () => {
        const first = repo.query()[0];
        store.toggleHidden(first.id);
        ok(!repo.query().some((c) => c.id === first.id), 'hidden concert still listed');
        ok(repo.query({ includeHidden: true }).some((c) => c.id === first.id));
        store.toggleHidden(first.id);
      });
      test('reminder preferences default on and can be changed', () => {
        eq(store.reminderPref('openingSoon'), true);
        store.setReminderPref('dailyContent', false);
        eq(store.reminderPref('dailyContent'), false);
      });
      test('backup round-trips marks and posted listens', () => {
        store.toggleMark('feed-tonhalle-2055210', 'saved');
        localStorage.setItem('klang.activity.posts.v1', JSON.stringify([{ trackId: 1, title: 'T', at: '2026-10-26T10:00:00Z' }]));
        const backup = store.exportUserData();
        store.resetAll();
        ok(!store.isMarked('feed-tonhalle-2055210', 'saved'), 'reset clears marks');
        eq(JSON.parse(localStorage.getItem('klang.activity.posts.v1')), [], 'reset clears posts');
        store.importUserData(backup);
        ok(store.isMarked('feed-tonhalle-2055210', 'saved'), 'mark restored');
        eq(JSON.parse(localStorage.getItem('klang.activity.posts.v1')).length, 1, 'posts restored');
      });
      test('marks: going + attended, review keeps record', () => {
        store.toggleMark('feed-osr-beethoven-1-4-5-20261105', 'going');
        ok(store.isMarked('feed-osr-beethoven-1-4-5-20261105', 'going'));
        store.setReview('feed-osr-beethoven-1-4-5-20261105', { rating: 5 });
        eq(store.markOf('feed-osr-beethoven-1-4-5-20261105').rating, 5);
      });

      // ---------- listening: Apple Music Classical / Apple Music links (no audio in Klang) ----------
      const work = { id: 'bach-goldberg', title: 'Goldberg Variations' };
      const album = { id: 427415061, title: 'Bach: Goldberg Variations', artist: 'Glenn Gould', artwork: 'a.jpg', year: '1982' };
      test('pieceURL: exact track or whole album, in Apple Music Classical or Apple Music', () => {
        const piece = am.workPiece(work, 'Bach', album, { id: 427415063 });
        eq(am.pieceURL(piece, 'classical'), 'https://classical.music.apple.com/ch/album/427415061?i=427415063');
        eq(am.pieceURL(piece, 'music'), 'https://music.apple.com/ch/album/427415061?i=427415063');
        const noTrack = am.workPiece(work, 'Bach', album);
        eq(am.pieceURL(noTrack, 'classical'), 'https://classical.music.apple.com/ch/album/427415061');
        eq(am.pieceURL(noTrack, 'music'), 'https://music.apple.com/ch/album/427415061');
        eq(am.pieceURL(am.albumPiece(album), 'classical'), 'https://classical.music.apple.com/ch/album/427415061', 'album ignores track');
        eq(am.pieceURL(am.makePiece({ title: 'Goldberg Variations', composer: 'Bach' }), 'music'), 'https://music.apple.com/ch/search?term=Bach%20Goldberg%20Variations', 'no album: search');
      });
      test('piece ids: whole album, one id per work whether or not its track is known, one per movement', () => {
        const a = am.albumPiece(album);
        eq(a.id, 'album:427415061');
        eq(a.kind, 'album');
        eq(am.workPiece(work, 'Bach', album, { id: 427415063 }).id, am.workPiece(work, 'Bach', album).id);
        const mv = (trackId) => am.makePiece({ title: 'Variation', workId: work.id, collectionId: album.id, trackId });
        ok(mv(1).id !== mv(2).id, 'single movements of one work stay distinct');
        eq(am.toPlain(am.workPiece(work, 'Bach', album)).trackId, undefined, 'plain drops empty fields');
      });
      test('your own playlists: create, add / remove, rename, delete', () => {
        store.resetAll();
        const p1 = am.toPlain(am.workPiece(work, 'Bach', album, { id: 427415063 }));
        const p2 = am.toPlain(am.albumPiece(album));
        const pl = store.createPlaylist('  Sunday  ', p1);
        eq(pl.name, 'Sunday');
        eq(store.userPlaylists().map((x) => x.id), [pl.id]);
        ok(store.isInPlaylist(pl.id, p1.id), 'first item');
        eq(store.togglePlaylistItem(pl.id, p2), true);
        eq(store.playlist(pl.id).items.map((x) => x.id), [p1.id, p2.id]);
        store.moveInPlaylist(pl.id, p2.id, -1);
        eq(store.playlist(pl.id).items[0].id, p2.id, 'moved up');
        eq(store.togglePlaylistItem(pl.id, p1), false);
        ok(!store.isInPlaylist(pl.id, p1.id), 'removed');
        store.renamePlaylist(pl.id, 'Evening');
        eq(store.playlist(pl.id).name, 'Evening');
        store.renamePlaylist(pl.id, '   ');
        eq(store.playlist(pl.id).name, 'Evening', 'blank name ignored');
        ok(!store.hasPlaylist('concert-y') && store.togglePlaylist({ id: 'concert-y', name: 'Y', kind: 'concert', items: [] }), 'concert playlist');
        eq(store.userPlaylists().length, 1, 'concert playlists are not user playlists');
        store.deletePlaylist(pl.id);
        eq(store.playlist(pl.id), null);
        eq(store.userPlaylists().length, 0);
      });
      test('logListen puts a "listen" entry on the timeline (once per piece within 10 min)', () => {
        store.resetAll();
        const p = am.toPlain(am.workPiece(work, 'Bach', album, { id: 427415063 }));
        store.logListen(p, 'Apple Music Classical');
        store.logListen(p, 'Apple Music Classical');
        const t = store.timeline();
        eq(t.length, 1);
        eq([t[0].type, t[0].id, t[0].label, t[0].app, t[0].trackId], ['listen', p.id, 'Goldberg Variations', 'Apple Music Classical', 427415063]);
      });
      test('listenLink is a real link that records Now listening with its queue', () => {
        const pieces = [am.workPiece(work, 'Bach', album, { id: 1 }), am.workPiece({ id: 'w2', title: 'Partita' }, 'Bach', album, { id: 2 })];
        const a = am.listenLink(pieces[0], 'Play all', { queue: pieces, index: 0 });
        eq([a.tagName, a.target], ['A', '_blank']);
        ok(a.href === am.pieceURL(pieces[0]), a.href);
        a.addEventListener('click', (e) => e.preventDefault());
        a.click();
        const L = am.listening();
        eq([L.current.id, L.next.id, L.queue.length], [pieces[0].id, pieces[1].id, 2]);
        am.clearListening();
        eq(am.listening().current, null);
      });
      test('backup round-trips your own playlists', () => {
        store.resetAll();
        const p = am.toPlain(am.albumPiece(album));
        const pl = store.createPlaylist('Road trip', p);
        const backup = store.exportUserData();
        store.resetAll();
        eq(store.userPlaylists().length, 0, 'reset clears playlists');
        store.importUserData(backup);
        const back = store.playlist(pl.id);
        ok(back && back.kind === 'user', 'playlist restored');
        eq([back.name, back.items.map((x) => x.id)], ['Road trip', [p.id]]);
      });
    } finally {
      for (const [k, v] of Object.entries(savedKeys)) {
        try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {}
      }
    }

    // ---------- ▶ Preview: a lookup that ends after a newer tap, or after the user left the page, plays nothing ----------
    {
      const pv = await import('../js/ui/preview.js');
      const music = await import('../js/music.js');
      const SILENT = 'data:audio/mp4;base64,AAAAHGZ0eXBNNEEgAAACAE00QSBpc29taXNvMgAAAAhmcmVlAAAAG21kYXQhEAUgpBv/wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=';
      const slow = (track, ms) => () => new Promise((r) => setTimeout(() => r({ track }), ms));
      const pause = (ms) => new Promise((r) => setTimeout(r, ms));
      const a = { id: 'a', title: 'A', preview: SILENT };
      const b = { id: 'b', title: 'B', preview: `${SILENT}#b` };
      music.preview.stop();
      const left = pv.previewButton({ resolve: slow(a, 30) });
      document.body.append(left);
      left.click();
      left.remove(); // the user went to another page
      await pause(120);
      const afterLeaving = music.previewState().track;
      const slowBtn = pv.previewButton({ resolve: slow(a, 80) });
      const fastBtn = pv.previewButton({ resolve: slow(b, 10) });
      document.body.append(slowBtn, fastBtn);
      slowBtn.click();
      fastBtn.click(); // a newer tap
      await pause(200);
      const afterNewer = music.previewState().track;
      slowBtn.remove();
      fastBtn.remove();
      music.preview.stop();
      test('▶ Preview: a slow lookup does not start audio after the user left the page or tapped another preview', () => {
        eq(afterLeaving, null, 'left the page');
        eq(afterNewer?.id, 'b', 'the newer tap wins');
      });
    }

    document.getElementById('summary').innerHTML = fail ? `<span class="fail">${fail} failed</span>, ${pass} passed` : `<span class="pass">All ${pass} tests passed</span>`;
    window.__results = { pass, fail };
  </script>
